name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # pages are frozen; the limit stops a build that would execute them
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project with docs and test groups
        run: uv sync --group docs --group test

      - name: Tests with coverage
        run: uv run pytest -q --cov=dohl --cov-report=html --cov-report=xml

      - name: Render the site
        working-directory: doc
        run: |
          uv run quartodoc build
          uv run quartodoc interlinks
          uv run quarto render

      - name: Add the coverage report and badge
        run: |
          mkdir -p doc/_site/coverage
          cp -r htmlcov/. doc/_site/coverage/
          uvx --from "genbadge[coverage]" genbadge coverage -i coverage.xml -o doc/_site/coverage/badge.svg

      - uses: actions/upload-pages-artifact@v5
        with:
          path: doc/_site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
