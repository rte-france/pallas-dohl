[build-system]
requires = [
    "setuptools>=68.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "dohl"
version = "2026.0.1"
authors = [
    { name = "Rte R&D and Mews Labs", email = "emmanuel.cieren@mews-labs.com" },
]
description = "Damage in Overhead Lines application."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Mozilla Public License 2.0",
]
dependencies = [
    "numpy >= 1.21.2",
    "pandas >= 1.4.1",
    "pyyaml >= 5.3.1",
    "scikit-learn >= 1.3.2",
]

[dependency-groups]
doc = ["sphinx", "sphinx_rtd_theme"]
examples = ["matplotlib >= 3.4.3", ]
test = [
    "pytest >= 7.2.2",
    "pytest-cov >= 6.0.0",
]
lint = [
    "ruff >= 0.6.0",
    "mypy >= 1.13.0",
]
dev = [
    { include-group = 'test' },
    { include-group = 'lint' },
    { include-group = 'examples' },
]

[project.urls]
"Homepage" = "https://github.com/rte-france/pallas-dohl"
"Bug Tracker" = "https://github.com/rte-france/pallas-dohl/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["dohl"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/dohl/_fatigue_model_input.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long (the formatter handles it)
    "E741",  # ambiguous single-char names (l, m, n are intentional in damping formulas)
    "E203",  # formatter-incompatible whitespace rule
    "B006",  # mutable default arg (now fixed via Optional[dict] = None)
]

[tool.ruff.format]
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
